name: ClipFlow Video Processing Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Processing Job ID'
        required: true
        type: string
      videoId:
        description: 'Source Video ID'
        required: true
        type: string
      videoUrl:
        description: 'YouTube URL or Video ID'
        required: true
        type: string
      workspaceId:
        description: 'Workspace ID'
        required: false
        default: 'default-workspace'
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python Whisper & Requests
        run: |
          pip install --no-cache-dir openai-whisper torch torchvision torchaudio requests

      - name: Locate Project Root & Install Node Dependencies
        run: |
          PKG_PATH=$(find . -name "package.json" -print -quit)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found in repository."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found package.json in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          npm install

      - name: Run GitHub Runner Processing Worker
        env:
          JOB_ID: ${{ github.event.inputs.jobId }}
          VIDEO_ID: ${{ github.event.inputs.videoId }}
          VIDEO_URL: ${{ github.event.inputs.videoUrl }}
          WORKSPACE_ID: ${{ github.event.inputs.workspaceId }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          PIPED_INSTANCES: ${{ secrets.PIPED_INSTANCES }}
        run: |
          PROJECT_DIR="${{ env.PROJECT_DIR }}"
          if [ -z "$PROJECT_DIR" ]; then
            PKG_PATH=$(find . -name "package.json" -print -quit)
            PROJECT_DIR=$(dirname "$PKG_PATH")
          fi
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "Running worker from project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          node worker/githubRunnerWorker.js
