name: ClipFlow Video Processing Worker

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Processing Job ID'
        required: true
        type: string
      videoId:
        description: 'Source Video ID'
        required: true
        type: string
      videoUrl:
        description: 'YouTube URL or Video ID'
        required: true
        type: string
      workspaceId:
        description: 'Workspace ID'
        required: false
        default: 'default-workspace'
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository Root
        run: |
          echo "Current working directory:"
          pwd
          echo "Directory contents:"
          ls -la
          if [ ! -f package.json ]; then
            echo "FATAL ERROR: package.json not found in repository root $(pwd)"
            exit 1
          fi
          echo "Verified root package.json at: $(pwd)/package.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg & Build Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3-pip

      - name: Install Python Whisper & Requests
        run: |
          pip install --no-cache-dir openai-whisper torch torchvision torchaudio requests

      - name: Install Node Dependencies
        run: |
          echo "Installing Node.js dependencies from repository root..."
          npm install

      - name: Verify Worker Module Dependencies
        run: |
          node -e "import('node-fetch').then(() => console.log('node-fetch verification: OK'))"

      - name: Run GitHub Runner Processing Worker
        env:
          JOB_ID: ${{ github.event.inputs.jobId }}
          VIDEO_ID: ${{ github.event.inputs.videoId }}
          VIDEO_URL: ${{ github.event.inputs.videoUrl }}
          WORKSPACE_ID: ${{ github.event.inputs.workspaceId }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          PIPED_INSTANCES: ${{ secrets.PIPED_INSTANCES }}
        run: |
          echo "Executing processing worker from $(pwd)/worker/githubRunnerWorker.js..."
          node worker/githubRunnerWorker.js
